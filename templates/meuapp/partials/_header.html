{% load static %}

<header class="header">
    <div class="logo">
        <a href="{% url 'index' %}">Meu Site</a>
    </div>
    
    <nav class="nav">
        <a href="{% url 'index' %}">Home</a>
    
        {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}">Nova Reserva</a>
            <a href="{% url 'minhas_reservas' %}">Minhas Reservas</a>
            <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'cadastro' %}">Cadastro</a>
        {% endif %}
    
        {% if user.is_superuser %}
            <a href="{% url 'admin:index' %}">Área do Administrador</a>
        {% endif %}
    </nav>    
</header>
